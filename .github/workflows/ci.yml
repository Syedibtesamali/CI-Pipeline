 name: python CI

 on:
   push:
   pull_request:
 jobs:
   test:
     runs-on: ubuntu-latest
      steps:
        - name: checkout code 
          uses: actions/checkout@v4

        - name: set up python 
          uses: actions/setup-python@v5
          with:
            python-version: "3.12"
        - name: install dependencies
          run: python -m pip install -r requirements.txt
        - name: run tests
          run: python -m pytest
